[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false
license = "AGPL-3.0-only"

[workspace.dependencies]
# Internal crates
shared-kernel = { path = "crates/shared-kernel" }

# Serialization, identifiers
serde = { version = "1.0.229", features = ["derive"] }
uuid = "1.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
